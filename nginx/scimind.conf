map $http_upgrade $connection_upgrade {
      default keep-alive;
      'websocket' upgrade;
}
server {
    listen   80;
    ## 修改 (初次修改）
    ## 根据实际服务器ip地址进行修改
    server_name 139.9.145.237;
    client_max_body_size 50M;
    ## 修改 (初次修改）
    ## 初次使用的时候，创建相应的文件夹以及文件。如果不创建会导致nginx找不到相应的日志位置。
    ## mkdir -p /apps/nginx/prod
    ## touch /apps/nginx/prod/success.log
    ## touch /apps/nginx/prod/error.log
    access_log /apps/nginx/1panel/success.log;
    error_log /apps/nginx/1panel/error.log;

    gzip on;
        gzip_buffers 32 4K;
        gzip_comp_level 6;
        gzip_min_length 100;
        gzip_types application/javascript text/css text/xml;
        gzip_disable "MSIE [1-6]\.";
        gzip_vary on;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }

    location /prod-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        ## 修改
        ## 这里根据后端提供的端口进行修改（一般不修改）
        proxy_pass http://127.0.0.1:9999/;
	    proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection  $connection_upgrade;
        error_page 405 =200 http://$host$request_uri;
    }

    # PDF文件存储转发
    location /profile/ {
        alias /data/;
    }

    location /files {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        ## 修改
        ## 这里根据后端提供的端口进行修改（一般不修改）
        proxy_pass http://127.0.0.1:5050;
	    proxy_http_version 1.1;
        error_page 405 =200 http://$host$request_uri;
    }

    location /console/api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        ## 修改
        ## 这里根据后端提供的端口进行修改（一般不修改）
        proxy_pass http://127.0.0.1:5050/console/api/;
	    proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection  $connection_upgrade;
        error_page 405 =200 http://$host$request_uri;
    }



    location /inner/api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        ## 修改
        ## 这里根据后端提供的端口进行修改（一般不修改）
        proxy_pass http://127.0.0.1:5050/inner/api/;
            proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection  $connection_upgrade;
        error_page 405 =200 http://$host$request_uri;
    }


    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        ## 修改
        ## 这里根据后端提供的端口进行修改（一般不修改）
        proxy_pass http://127.0.0.1:5050/api/;
	    proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection  $connection_upgrade;
        error_page 405 =200 http://$host$request_uri;
    }


    location /ws {
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 这里需要更改到后端的ip地址。
        proxy_pass http://127.0.0.1:5050/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection  $connection_upgrade;
        error_page 405 =200 http://$host$request_uri;
    }

    location / {
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        ## 修改
        ## 这里根据后端提供的端口进行修改（一般不修改）
        proxy_pass http://localhost:3001;
	    proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection  $connection_upgrade;
        error_page 405 =200 http://$host$request_uri;
    }

}
